aid: prometheus-fuels
name: Prometheus Fuels
image: https://prometheusfuels.ai/wp-content/uploads/2026/03/logo_favicon-300x300.png
description: >-
  Prometheus Fuels is a Santa Cruz, California energy company founded in 2019 by Rob McGinnis and
  launched out of Y Combinator, producing carbon-neutral electrofuels from atmospheric CO2. Its
  "no-desorb" direct air capture system dissolves CO2 into carbonate ions in water, and its Faraday
  Reactor hydrocarbon electrolyzer converts that carbon into methanol, gasoline, diesel, jet fuel and
  renewable natural gas at room temperature and atmospheric pressure using off-grid solar power. The
  company also markets an Ultra Long Duration Energy Storage (ULDES) product aimed at data-center
  power, and operates the Titan Forge Alpha pilot plant in Santa Cruz. It is backed by BMW i Ventures,
  Maersk Growth and Y Combinator. Prometheus Fuels publishes no product API, developer portal or SDK —
  it is a physical fuels manufacturer. The single machine-readable surface it operates is the
  WordPress REST API (wp/v2) behind its corporate site at prometheusfuels.ai, which serves anonymous
  read access to pages, posts, the site's `news-articles` custom post type, categories, tags, media,
  comments, users, search, taxonomies, types and statuses, with write operations gated behind
  WordPress application passwords. This profile was enriched by the API Evangelist pipeline from that
  live surface.
