hypermedia:
  note: >-
    Every resource carries a `_links` object naming its related collections (self, collection, author,
    replies, wp:featuredmedia, wp:term), and `?_embed` inlines them under `_embedded`.
not_modelled:
  note: >-
    Prometheus Fuels' fuel production, ULDES, plant telemetry and offtake domain entities are NOT
    represented anywhere in a public API. Nothing about them is modelled here.
