    body: '{"code":"rest_post_invalid_id","message":"Invalid post ID.","data":{"status":404}}'
  - request: GET /wp/v2/nope
    body: '{"code":"rest_no_route","message":"No route was found matching the URL and request method.","data":{"status":404}}'
  - request: GET /wp/v2/posts?per_page=9999
    body: '{"code":"rest_invalid_param","message":"Invalid parameter(s): per_page","data":{"status":400}}'
  detail: errors/prometheus-fuels-problem-types.yml
rate_limits:
  published: false
  note: >-
    No rate-limit policy is published for this host and no RateLimit/X-RateLimit headers were observed
    on probed responses. Not asserted either way. robots.txt does declare `Crawl-delay: 10`, which is
    a crawler courtesy directive, not an API rate limit.
caching:
  cache_control_observed: max-age=172800
  vary: User-Agent
  note: >-
    Collection responses were served with Cache-Control: max-age=172800 and an Expires header,
    together with `X-Robots-Tag: noindex` and `X-Content-Type-Options: nosniff`.
request_tracing:
  request_id_header: null
  note: No provider-specific request-id header was observed on any probed response.
content_negotiation:
  request: application/json
  response: application/json; charset=UTF-8
  allowed_request_headers: >-
    Access-Control-Allow-Headers advertises Authorization, X-WP-Nonce, Content-Disposition,
    Content-MD5, Content-Type.
  method_override_header: X-HTTP-Method-Override
  method_override_note: >-
    WordPress accepts POST with X-HTTP-Method-Override for PUT/PATCH/DELETE where clients cannot
    issue those verbs.
